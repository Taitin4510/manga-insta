name: 画像をつくる

on:
  push:
    branches: [main]
    paths: ["drafts/*.csv"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 日本語フォントとPillowを入れる
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          pip install pillow
      - name: まだ画像がないCSVを画像にする
        run: |
          for f in drafts/manga_*.csv; do
            d=$(basename "$f" .csv | sed 's/manga_//')
            if [ ! -d "images/$d" ]; then python scripts/render.py "$f"; fi
          done
      - name: 画像を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "画像を追加"
          git pull --rebase
          git push
